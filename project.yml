name: dabterm
options:
  bundleIdPrefix: com.dab
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftTerm:
    path: Packages/SwiftTerm
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
  DabCrypto:
    path: Packages/DabCrypto
  WasmKit:
    url: https://github.com/swiftwasm/WasmKit
    from: "0.4.2"
targets:
  dabterm:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: dabterm
        excludes:
          - "Editor/web/**"
          - "Resources/editor/**"
          - "Resources/packs/**"
      - path: dabterm/Resources/editor
        type: folder
        buildPhase: resources
      - path: dabterm/Resources/packs
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Install Python standard library
        path: scripts/install-python-stdlib.sh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dab.dabterm
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: dabterm/Info.plist
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: "-ObjC"
        # Python.xcframework slices (xcodegen links the xcframework but the compiler needs the slice on -F)
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/Vendor/python-ios/Python.xcframework/ios-arm64_x86_64-simulator"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Vendor/python-ios/Python.xcframework/ios-arm64"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: DabCrypto
      - package: WasmKit
        product: WasmKit
      - package: WasmKit
        product: WasmKitWASI
      - framework: Vendor/python-ios/Python.xcframework
        embed: true
        codeSign: true
        optional: true

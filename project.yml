name: dabterm
options:
  bundleIdPrefix: com.dab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.99.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
  DabCrypto:
    path: Packages/DabCrypto
targets:
  dabterm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: dabterm
        excludes:
          - "Editor/web/**"
          - "Resources/editor/**"
          - "Resources/packs/**"
      - path: dabterm/Resources/editor
        type: folder
        buildPhase: resources
      - path: dabterm/Resources/packs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dab.dabterm
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: dabterm/Info.plist
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: "-ObjC"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: DabCrypto
